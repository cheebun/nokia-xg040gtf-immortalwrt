log:
  level: error
  file: /var/log/mosdns.log

api:
  http: "127.0.0.1:9091"

plugins:
  # ---- Upstreams: Alibaba / Tencent / Volcengine only (no ISP DNS), 3 concurrent ----
  - tag: forward_local
    type: forward
    args:
      concurrent: 3
      upstreams:
        - addr: udp://223.5.5.5
        - addr: udp://223.6.6.6
        - addr: udp://119.29.29.29
        - addr: udp://119.28.28.28
        - addr: udp://180.184.1.1
        - addr: udp://180.184.2.2

  # ---- Cache ----
  - tag: cache
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400

  # ---- Strip dnsmasq ECS (add-subnet=32,128) before upstream ----
  - tag: ecs
    type: ecs_handler
    args:
      forward: false
      send: false

  # ---- Local custom records ----
  - tag: hosts
    type: hosts
    args:
      entries:
        - "domain:a.c 10.18.0.136"

  # ---- Blocked domains -> NXDOMAIN ----
  - tag: deny_set
    type: domain_set
    args:
      exps:
        - "domain:dm.wo.com.cn"
        - "domain:fxltsbl.com"
        - "domain:zzhc.vnet.cn"
        - "domain:typdm.tydevice.com"
        - "domain:event-log.cnbj1.mi-fds.com"
        - "domain:detection-aigc.engine.miui.com"
        - "domain:api.installer.xiaomi.com"
        - "domain:virus-engine.sec.miui.com"
        - "domain:t1.a.market.xiaomi.com"
        - "domain:t5.a.market.xiaomi.com"

  # ---- Main sequence: ECS strip -> hosts -> deny -> prefer IPv4 -> cache -> upstream ----
  - tag: main_sequence
    type: sequence
    args:
      - exec: $ecs
      - exec: $hosts
      - matches: has_resp
        exec: accept
      - matches: qname $deny_set
        exec: reject 3
      - exec: prefer_ipv4
      - exec: $cache
      - exec: $forward_local

  # ---- Listen on loopback only (dnsmasq :53 -> mosdns 127.0.0.1:5354) ----
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5354

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5354
